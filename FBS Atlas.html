      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"

    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-void: #0a1410;
        --turf: #132a1e;
        --turf-light: #1e3d2a;
        --turf-border: #2c4a38;
        --chalk: #f1ede2;
        --chalk-dim: #9faa9c;
        --floodlight: #f2b138;
        --floodlight-dim: #8a6a2a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg-void);
        color: var(--chalk);
        font-family: "IBM Plex Sans", sans-serif;
        overflow: hidden;
      }

      .app {
        display: flex;
        height: 100vh;
        width: 100vw;
      }

      /* ---------- SIDEBAR ---------- */
      .sidebar {
        width: 400px;
        min-width: 400px;
        height: 100%;
        background: var(--turf);
        border-right: 1px solid var(--turf-border);
        display: flex;
        flex-direction: column;
        z-index: 10;
      }

      .header {
        padding: 22px 22px 0 22px;
      }

      .eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.18em;
        color: var(--floodlight);
        text-transform: uppercase;
        margin: 0 0 6px 0;
      }

      h1 {
        font-family: "Anton", sans-serif;
        font-weight: 400;
        font-size: 32px;
        line-height: 0.95;
        letter-spacing: 0.01em;
        margin: 0 0 10px 0;
        color: var(--chalk);
      }

      .sub {
        font-size: 13px;
        color: var(--chalk-dim);
        line-height: 1.5;
        margin: 0 0 16px 0;
      }

      /* yard-line divider — signature element */
      .yardline {
        position: relative;
        height: 26px;
        margin: 0 0 16px 0;
        border-top: 2px solid var(--turf-border);
      }

      .yardline .ticks {
        display: flex;
        justify-content: space-between;
        padding: 0 1px;
      }

      .yardline .tick {
        font-family: "JetBrains Mono", monospace;
        font-size: 9px;
        color: var(--chalk-dim);
        position: relative;
        top: 5px;
      }

      .yardline .tick::before {
        content: "";
        position: absolute;
        top: -9px;
        left: 50%;
        width: 1px;
        height: 6px;
        background: var(--turf-border);
      }

      .controls {
        padding: 0 22px 14px 22px;
        border-bottom: 1px solid var(--turf-border);
      }

      .search {
        width: 100%;
        background: var(--bg-void);
        border: 1px solid var(--turf-border);
        color: var(--chalk);
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 13.5px;
        padding: 10px 12px;
        border-radius: 3px;
        outline: none;
        margin-bottom: 12px;
      }

      .search::placeholder {
        color: var(--chalk-dim);
      }

      .search:focus {
        border-color: var(--floodlight-dim);
      }

      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .pill {
        font-family: "JetBrains Mono", monospace;
        font-size: 10.5px;
        letter-spacing: 0.02em;
        padding: 5px 9px;
        border-radius: 2px;
        border: 1px solid var(--turf-border);
        background: transparent;
        color: var(--chalk-dim);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition:
          border-color 0.12s,
          color 0.12s,
          background 0.12s;
        user-select: none;
      }

      .pill .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex: none;
      }

      .pill.active {
        color: var(--chalk);
        border-color: currentColor;
        background: var(--turf-light);
      }

      .pill:hover {
        border-color: var(--chalk-dim);
      }

      .pill-clear {
        font-family: "JetBrains Mono", monospace;
        font-size: 10.5px;
        color: var(--chalk-dim);
        background: none;
        border: none;
        cursor: pointer;
        text-decoration: underline;
        padding: 5px 2px;
      }

      .count-row {
        padding: 12px 22px 8px 22px;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--chalk-dim);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        display: flex;
        justify-content: space-between;
      }

      .list {
        flex: 1;
        overflow-y: auto;
        padding: 0 10px 20px 10px;
      }

      .list::-webkit-scrollbar {
        width: 8px;
      }

      .list::-webkit-scrollbar-track {
        background: transparent;
      }

      .list::-webkit-scrollbar-thumb {
        background: var(--turf-border);
        border-radius: 4px;
      }

      .card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 12px;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid transparent;
        transition:
          background 0.12s,
          border-color 0.12s;
      }

      .card:hover {
        background: var(--turf-light);
      }

      .card.selected {
        background: var(--turf-light);
        border-color: var(--floodlight-dim);
      }

      .rank {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--chalk-dim);
        width: 22px;
        flex: none;
        text-align: right;
      }

      .swatch {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex: none;
      }

      .card-main {
        flex: 1;
        min-width: 0;
      }

      .card-team {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--chalk);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .card-stadium {
        font-size: 11.5px;
        color: var(--chalk-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .stadium-link {
        color: var(--chalk-dim);
        text-decoration: none;
        border-bottom: 1px dotted var(--turf-border);
        transition: color 0.12s, border-color 0.12s;
      }

      .stadium-link:hover {
        color: var(--floodlight);
        border-bottom-color: var(--floodlight-dim);
      }

      .card-cap {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        font-weight: 700;
        color: var(--floodlight);
        font-variant-numeric: tabular-nums;
        flex: none;
      }

      .empty-state {
        padding: 40px 20px;
        text-align: center;
        color: var(--chalk-dim);
        font-size: 13px;
      }

      /* ---------- MAP ---------- */
      .mapwrap {
        flex: 1;
        position: relative;
        height: 100%;
      }

      #map {
        height: 100%;
        width: 100%;
        background: var(--bg-void);
      }

      .leaflet-popup-content-wrapper {
        background: var(--turf);
        color: var(--chalk);
        border-radius: 5px;
        border: 1px solid var(--turf-border);
      }

      .leaflet-popup-tip {
        background: var(--turf);
        border: 1px solid var(--turf-border);
      }

      .leaflet-popup-content {
        margin: 12px 14px;
        font-family: "IBM Plex Sans", sans-serif;
      }

      .leaflet-container a.leaflet-popup-close-button {
        color: var(--chalk-dim);
      }

      .popup-team {
        font-family: "Anton", sans-serif;
        font-size: 17px;
        letter-spacing: 0.01em;
        color: var(--chalk);
        margin-bottom: 2px;
      }

      .popup-stadium {
        font-size: 12px;
        color: var(--chalk-dim);
        margin-bottom: 8px;
      }

      .popup-row {
        display: flex;
        justify-content: space-between;
        font-size: 11.5px;
        padding: 3px 0;
        border-top: 1px solid var(--turf-border);
      }

      .popup-row span:first-child {
        color: var(--chalk-dim);
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .popup-row span:last-child {
        font-family: "JetBrains Mono", monospace;
        font-variant-numeric: tabular-nums;
      }

      .leaflet-control-zoom a {
        background: var(--turf) !important;
        color: var(--chalk) !important;
        border-color: var(--turf-border) !important;
      }

      .leaflet-control-attribution {
        background: rgba(10, 20, 16, 0.7) !important;
        color: var(--chalk-dim) !important;
      }

      .leaflet-control-attribution a {
        color: var(--chalk-dim) !important;
      }

      /* mobile */
      @media (max-width: 820px) {
        .app {
          flex-direction: column;
        }

        .sidebar {
          width: 100%;
          min-width: 0;
          height: 44%;
          border-right: none;
          border-bottom: 1px solid var(--turf-border);
        }

        .mapwrap {
          height: 56%;
        }

        h1 {
          font-size: 26px;
        }
      }

      :focus-visible {
        outline: 2px solid var(--floodlight);
        outline-offset: 1px;
      }
    </style>
  </head>

        },
         {
          stadium: "Jerry Richardson Stadium",
          link: "https://maps.app.goo.gl/yFrJMoiPiGRYGmvb8",
          city: "Charlotte",
          state: "NC",
          team: "Charlotte",
          conference: "C-USA",
          capacity: 15314,
          built: "2013",
          expanded: "",
          lat: 35.22709,
          lng: -80.84313,
        },
        {
          stadium: "Clarence T. C. Ching Athletics Complex",
          link: "https://maps.app.goo.gl/9VUpSE2X45CnLHWw7",
          city: "Honolulu",
          state: "HI",
          team: "Hawaii",
          conference: "Mountain West",
          capacity: 15194,
          built: "2015",
          expanded: "2023",
          lat: 21.294,
          lng: -157.818,
        }
      ];
      const CONF_COLORS = {
        ACC: "#E8A33D",
        American: "#56B6C2",
        "Big 12": "#D2691E",
        "Big Ten": "#4F86C6",
        "C-USA": "#9B7EDE",
        Independent: "#C9C4B4",
        MAC: "#6FAE8E",
        "Mountain West": "#D9779B",
        "Pac-12": "#52A675",
        SEC: "#D9534F",
        "Sun Belt": "#E0C341",
      };

      // ---------- map setup ----------
      const map = L.map("map", {
        zoomControl: true,
        minZoom: 3,
        worldCopyJump: true,
      }).setView([39.5, -98.35], 4.4);

      L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
          subdomains: "abcd",
          maxZoom: 19,
        },
      ).addTo(map);

      function radiusFor(cap) {
        const c = cap || 20000;
        return Math.max(4, Math.sqrt(c) / 17);
      }

      const markers = {};
      const layerGroup = L.layerGroup().addTo(map);

      function keyFor(d) {
        return d.stadium + "|" + d.city;
      }

      DATA.forEach((d) => {
        const color = CONF_COLORS[d.conference] || "#F1EDE2";
        const m = L.circleMarker([d.lat, d.lng], {
          radius: radiusFor(d.capacity),
          color: color,
          weight: 1.5,
          fillColor: color,
          fillOpacity: 0.55,
          opacity: 0.9,
        });
        m.bindPopup(
          `
    <div class="popup-team">${d.team}</div>
    <div class="popup-stadium"><a class="stadium-link" href="${d.link}" target="_blank" rel="noopener">${d.stadium}</a> · ${d.city}, ${d.state}</div>
    <div class="popup-row"><span>Conference</span><span>${d.conference}</span></div>
    <div class="popup-row"><span>Capacity</span><span>${d.capacity ? d.capacity.toLocaleString() : "—"}</span></div>
    <div class="popup-row"><span>Built</span><span>${d.built || "—"}</span></div>
    <div class="popup-row"><span>Expanded</span><span>${d.expanded || "—"}</span></div>
  `,
          { maxWidth: 240 },
        );
        m.on("click", () => selectCard(keyFor(d), false));
        markers[keyFor(d)] = m;
        layerGroup.addLayer(m);
      });

      // ---------- sidebar: conference pills ----------
      const pillsEl = document.getElementById("pills");
      const activeConfs = new Set(Object.keys(CONF_COLORS));

      function renderPills() {
        pillsEl.innerHTML = "";
        Object.keys(CONF_COLORS).forEach((conf) => {
          const el = document.createElement("div");
          el.className = "pill" + (activeConfs.has(conf) ? " active" : "");
          el.style.color = activeConfs.has(conf) ? CONF_COLORS[conf] : "";
          el.innerHTML = `<span class="dot" style="background:${CONF_COLORS[conf]}"></span>${conf}`;
          el.addEventListener("click", () => {
            if (activeConfs.has(conf)) activeConfs.delete(conf);
            else activeConfs.add(conf);
            renderPills();
            applyFilters();
          });
          pillsEl.appendChild(el);
        });
        const clear = document.createElement("button");
        clear.className = "pill-clear";
        clear.textContent = "reset";
        clear.addEventListener("click", () => {
          Object.keys(CONF_COLORS).forEach((c) => activeConfs.add(c));
          renderPills();
          applyFilters();
        });
        pillsEl.appendChild(clear);
      }
      renderPills();

      // ---------- sidebar: list ----------
      const listEl = document.getElementById("list");
      const searchEl = document.getElementById("search");
      const countLabel = document.getElementById("count-label");
      let selectedKey = null;

      function matches(d, q) {
        if (!activeConfs.has(d.conference)) return false;
        if (!q) return true;
        const hay = (
          d.team +
          " " +
          d.stadium +
          " " +
          d.city +
          " " +
          d.state +
          " " +
          d.conference
        ).toLowerCase();
        return hay.includes(q);
      }

      function renderList() {
        const q = searchEl.value.trim().toLowerCase();
        const filtered = DATA.filter((d) => matches(d, q));
        countLabel.textContent = `${filtered.length} stadium${filtered.length === 1 ? "" : "s"}`;

        if (filtered.length === 0) {
          listEl.innerHTML =
            '<div class="empty-state">Sorry, No stadiums match. Try clearing filters or search.</div>';
          return;
        }

        listEl.innerHTML = filtered
          .map(
            (d, i) => `
    <div class="card${keyFor(d) === selectedKey ? " selected" : ""}" data-key="${keyFor(d).replace(/"/g, "&quot;")}">
      <span class="rank">${i + 1}</span>
      <span class="swatch" style="background:${CONF_COLORS[d.conference]}"></span>
      <div class="card-main">
        <div class="card-team">${d.team}</div>
        <div class="card-stadium"><a class="stadium-link" href="${d.link}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${d.stadium}</a> · ${d.city}, ${d.state}</div>
      </div>
      <div class="card-cap">${d.capacity ? d.capacity.toLocaleString() : "—"}</div>
    </div>
  `,
          )
          .join("");

        listEl.querySelectorAll(".card").forEach((card) => {
          card.addEventListener("click", () =>
            selectCard(card.dataset.key, true),
          );
        });
      }

      function selectCard(key, flyMap) {
        selectedKey = key;
        document.querySelectorAll(".card").forEach((c) => {
          c.classList.toggle("selected", c.dataset.key === key);
        });
        const d = DATA.find((x) => keyFor(x) === key);
        if (!d) return;
        if (flyMap) {
          map.flyTo([d.lat, d.lng], Math.max(map.getZoom(), 7), {
            duration: 0.6,
          });
        }
        const m = markers[key];
        if (m) setTimeout(() => m.openPopup(), flyMap ? 500 : 0);

        const card = document.querySelector(
          `.card[data-key="${key.replace(/"/g, '\\"')}"]`,
        );
        if (card) card.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }

      function applyFilters() {
        layerGroup.clearLayers();
        DATA.forEach((d) => {
          if (activeConfs.has(d.conference))
            layerGroup.addLayer(markers[keyFor(d)]);
        });
        renderList();
      }

      searchEl.addEventListener("input", renderList);

      renderList();
    </script>
